<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おえかき</title>
<style>
  :root{
    --bg: #1b1b1f;
    --panel: #232329;
    --panel-2: #2c2c33;
    --ink: #f2f0ea;
    --muted: #8b8a94;
    --accent: #f2f0ea;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  header {
    padding: 12px 14px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 0;
  }
  h1 span { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: 6px; }
  #save {
    background: var(--panel);
    border: none;
    color: var(--ink);
    width: 38px;
    height: 38px;
    border-radius: 12px;
    font-size: 17px;
    cursor: pointer;
  }
  #save:active { background: var(--panel-2); }

  #canvas-wrap {
    flex: 1;
    margin: 4px 12px;
    border-radius: 18px;
    overflow: hidden;
    background: #ffffff;
    box-shadow: 0 0 0 1px #33333a;
    position: relative;
    touch-action: none;
  }
  #canvas-wrap canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  #dock {
    padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .row::-webkit-scrollbar { display: none; }

  .group {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--panel);
    padding: 5px;
    border-radius: 14px;
    flex-shrink: 0;
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--ink);
    font-size: 15px;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:active { background: var(--panel-2); }
  .icon-btn.active {
    background: var(--ink);
    color: #16161a;
  }

  .layer-tab {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    width: 30px;
    height: 34px;
    border-radius: 10px;
    cursor: pointer;
  }
  .layer-tab.active { background: var(--ink); color: #16161a; }
  .eye-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 13px;
    width: 26px;
    height: 34px;
    cursor: pointer;
    padding: 0;
  }
  .eye-btn.off { opacity: 0.35; }

  .pen-btn {
    font-size: 12px;
    font-weight: 600;
    padding: 0 10px;
    width: auto;
  }

  .swatches {
    display: flex;
    gap: 6px;
    background: var(--panel);
    padding: 5px;
    border-radius: 14px;
    flex: 1;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .swatches::-webkit-scrollbar { display: none; }
  .swatch {
    width: 32px;
    height: 32px;
    min-width: 32px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    position: relative;
  }
  .swatch.active {
    box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px currentColor;
  }

  #mode-btn {
    font-size: 11px;
    font-weight: 600;
    padding: 0 10px;
    width: auto;
    white-space: nowrap;
  }

  .size-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    padding: 5px 10px;
    border-radius: 14px;
    flex: 1;
    min-width: 90px;
  }
  .size-wrap span { font-size: 11px; color: var(--muted); flex-shrink: 0; }
  input[type="range"] {
    flex: 1;
    accent-color: var(--ink);
    min-width: 40px;
  }
</style>
</head>
<body>

<header>
  <h1>おえかき <span id="mode-label">random 4</span></h1>
  <button id="save" title="保存">💾</button>
</header>

<div id="canvas-wrap"></div>

<div id="dock">

  <div class="row">
    <div class="group" id="layers"></div>
    <div class="group">
      <button class="icon-btn" id="undo" title="戻す">↺</button>
      <button class="icon-btn" id="redo" title="進む">↻</button>
      <button class="icon-btn" id="clear-layer" title="このレイヤーを消す">🗑</button>
    </div>
  </div>

  <div class="row">
    <button class="icon-btn pen-btn" id="mode-btn"></button>
    <button class="icon-btn" id="shuffle" title="パレットを変える">🎲</button>
    <div class="swatches" id="swatches"></div>
  </div>

  <div class="row">
    <div class="group">
      <button class="icon-btn pen-btn" data-pen="pencil">鉛筆</button>
      <button class="icon-btn pen-btn" data-pen="marker">マーカー</button>
      <button class="icon-btn" id="eraser" title="消しゴム">🧽</button>
      <button class="icon-btn" id="bucket" title="バケツ塗り">🪣</button>
    </div>
    <div class="size-wrap">
      <span>太さ</span>
      <input type="range" id="size" min="2" max="50" value="10">
    </div>
    <button class="icon-btn pen-btn" id="smoothing-btn"></button>
  </div>

</div>

<script>
(function(){
  const wrap = document.getElementById('canvas-wrap');
  const layersDock = document.getElementById('layers');
  const swatchWrap = document.getElementById('swatches');
  const sizeSlider = document.getElementById('size');
  const shuffleBtn = document.getElementById('shuffle');
  const modeBtn = document.getElementById('mode-btn');
  const modeLabel = document.getElementById('mode-label');
  const saveBtn = document.getElementById('save');
  const undoBtn = document.getElementById('undo');
  const redoBtn = document.getElementById('redo');
  const clearLayerBtn = document.getElementById('clear-layer');
  const eraserBtn = document.getElementById('eraser');
  const bucketBtn = document.getElementById('bucket');
  const penBtns = [...document.querySelectorAll('[data-pen]')];
  const smoothingBtn = document.getElementById('smoothing-btn');

  let dpr = Math.max(1, window.devicePixelRatio || 1);
  let currentColor = null;
  let currentTool = 'pencil'; // 'pencil' | 'marker' | 'eraser' | 'bucket'
  let drawing = false;
  let lastTime = 0;
  let rawPoint = null;    // 生の指の位置
  let smoothPoint = null; // 補正後の描画位置

  // 手ぶれ補正: 大きいほど生の位置に近い(遅延が少ない) = 補正弱い
  const SMOOTHING_LEVELS = [
    { key: 'off',   label: '補正:なし', factor: 1 },
    { key: 'light', label: '補正:弱',   factor: 0.6 },
    { key: 'heavy', label: '補正:強',   factor: 0.28 },
  ];
  let smoothingIndex = 1; // デフォルトは「弱」

  const PEN_STYLES = {
    marker: { widthMul: 1.0 }, // 現行の「鉛筆」相当: くっきり一定の太さの線
  };
  // 鉛筆はコード側で個別処理する(ストローク内でランダムに太さが変わるボコボコした線)
  const PENCIL_BASE_MUL = 0.6;

  // ---------- レイヤー管理 ----------
  const LAYER_COUNT = 3;
  const layers = []; // {canvas, ctx, visible, undoStack, redoStack}
  let activeLayerIndex = LAYER_COUNT - 1;

  function makeCanvas(z) {
    const c = document.createElement('canvas');
    c.style.zIndex = z;
    wrap.appendChild(c);
    return c;
  }

  for (let i = 0; i < LAYER_COUNT; i++) {
    const canvas = makeCanvas(i);
    layers.push({
      canvas,
      ctx: canvas.getContext('2d'),
      visible: true,
      undoStack: [],
      redoStack: [],
    });
  }

  function activeLayer() { return layers[activeLayerIndex]; }

  function buildLayerTabs() {
    layersDock.innerHTML = '';
    layers.forEach((layer, i) => {
      const tab = document.createElement('button');
      tab.className = 'layer-tab' + (i === activeLayerIndex ? ' active' : '');
      tab.textContent = (i + 1);
      tab.addEventListener('click', () => {
        activeLayerIndex = i;
        buildLayerTabs();
      });
      const eye = document.createElement('button');
      eye.className = 'eye-btn' + (layer.visible ? '' : ' off');
      eye.textContent = layer.visible ? '👁' : '🚫';
      eye.addEventListener('click', (e) => {
        e.stopPropagation();
        layer.visible = !layer.visible;
        layer.canvas.style.opacity = layer.visible ? '1' : '0';
        buildLayerTabs();
      });
      layersDock.appendChild(tab);
      layersDock.appendChild(eye);
    });
  }

  // ---------- カラーパレット ----------
  const DEFAULT_PALETTE = [
    '#111111', '#f2f0ea', '#e63946', '#f4a261',
    '#ffd166', '#2a9d8f', '#264653', '#4361ee',
    '#7b2cbf', '#ff70a6', '#8d6a4f', '#adb5bd'
  ];

  const MODES = ['random4', 'random3', 'default'];
  const MODE_LABELS = { random4: 'ランダム4色', random3: 'ランダム3色', default: '定番パレット' };
  let modeIndex = 0;

  function currentMode() { return MODES[modeIndex]; }

  function randomPalette(n) {
    const baseHue = Math.floor(Math.random() * 360);
    const arr = [];
    for (let i = 0; i < n; i++) {
      const h = (baseHue + i * (360 / n) + (Math.random() * 20 - 10)) % 360;
      const sat = 55 + Math.random() * 35;
      const isDark = i === n - 1;
      const light = isDark ? 12 + Math.random() * 10 : 38 + Math.random() * 28;
      arr.push(`hsl(${h.toFixed(0)}, ${sat.toFixed(0)}%, ${light.toFixed(0)}%)`);
    }
    return arr;
  }

  function buildSwatches(colors) {
    swatchWrap.innerHTML = '';
    colors.forEach((c) => {
      const b = document.createElement('button');
      b.className = 'swatch';
      b.style.background = c;
      b.style.color = c;
      b.addEventListener('click', () => selectColor(c, b));
      swatchWrap.appendChild(b);
    });
    selectColor(colors[0], swatchWrap.children[0]);
  }

  function selectColor(c, btn) {
    currentColor = c;
    [...swatchWrap.children].forEach(el => el.classList.remove('active'));
    if (btn) btn.classList.add('active');
    // 色を選んだら自動的にペンツールに戻す(消しゴムのままだと分かりにくいので)
    if (currentTool === 'eraser') setTool('pencil');
  }

  function applyMode() {
    const m = currentMode();
    modeLabel.textContent = MODE_LABELS[m];
    shuffleBtn.style.display = m === 'default' ? 'none' : 'flex';
    if (m === 'random4') buildSwatches(randomPalette(4));
    else if (m === 'random3') buildSwatches(randomPalette(3));
    else buildSwatches(DEFAULT_PALETTE);
  }

  modeBtn.addEventListener('click', () => {
    modeIndex = (modeIndex + 1) % MODES.length;
    applyMode();
  });
  shuffleBtn.addEventListener('click', () => {
    const m = currentMode();
    if (m === 'random4') buildSwatches(randomPalette(4));
    if (m === 'random3') buildSwatches(randomPalette(3));
  });

  // ---------- ツール切り替え ----------
  function setTool(tool) {
    currentTool = tool;
    penBtns.forEach(b => b.classList.toggle('active', b.dataset.pen === tool));
    eraserBtn.classList.toggle('active', tool === 'eraser');
    bucketBtn.classList.toggle('active', tool === 'bucket');
  }
  penBtns.forEach(b => b.addEventListener('click', () => setTool(b.dataset.pen)));
  eraserBtn.addEventListener('click', () => setTool('eraser'));
  bucketBtn.addEventListener('click', () => setTool('bucket'));

  function applySmoothingLabel() {
    smoothingBtn.textContent = SMOOTHING_LEVELS[smoothingIndex].label;
  }
  smoothingBtn.addEventListener('click', () => {
    smoothingIndex = (smoothingIndex + 1) % SMOOTHING_LEVELS.length;
    applySmoothingLabel();
  });

  // ---------- キャンバスサイズ ----------
  function resizeAllCanvases() {
    const rect = wrap.getBoundingClientRect();
    dpr = Math.max(1, window.devicePixelRatio || 1);

    layers.forEach(layer => {
      const prev = document.createElement('canvas');
      prev.width = layer.canvas.width;
      prev.height = layer.canvas.height;
      if (prev.width > 0) prev.getContext('2d').drawImage(layer.canvas, 0, 0);

      layer.canvas.width = rect.width * dpr;
      layer.canvas.height = rect.height * dpr;
      layer.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      layer.ctx.lineCap = 'round';
      layer.ctx.lineJoin = 'round';

      if (prev.width > 0) {
        layer.ctx.drawImage(prev, 0, 0, prev.width, prev.height, 0, 0, rect.width, rect.height);
      }
    });
  }
  // ---------- ストローク描画: レイヤーへ直接描いてリアルタイムに見えるようにする ----------
  function getPos(e) {
    const rect = wrap.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top, t: Date.now() };
  }

  function strokeWidthFor() {
    const base = Number(sizeSlider.value);
    if (currentTool === 'marker') return base * PEN_STYLES.marker.widthMul;
    if (currentTool === 'pencil') {
      // 数ピクセル程度ランダムに太さを揺らして、ボコボコした鉛筆線にする
      const jitter = Math.min(6, Math.max(1.5, base * 0.25));
      const w = base * PENCIL_BASE_MUL + (Math.random() - 0.5) * jitter * 2;
      return Math.max(1, w);
    }
    return base;
  }

  function pushHistory(layer) {
    layer.undoStack.push(layer.canvas.toDataURL());
    if (layer.undoStack.length > 20) layer.undoStack.shift();
    layer.redoStack = [];
  }

  // ---------- バケツ塗り ----------
  const colorProbe = document.createElement('canvas');
  colorProbe.width = 1; colorProbe.height = 1;
  const colorProbeCtx = colorProbe.getContext('2d');
  function colorToRGBA(str) {
    colorProbeCtx.clearRect(0, 0, 1, 1);
    colorProbeCtx.fillStyle = str;
    colorProbeCtx.fillRect(0, 0, 1, 1);
    return colorProbeCtx.getImageData(0, 0, 1, 1).data;
  }

  function floodFillAt(layer, cssX, cssY, fillColorStr) {
    const canvas = layer.canvas;
    const w = canvas.width, h = canvas.height;
    const px = Math.floor(cssX * dpr);
    const py = Math.floor(cssY * dpr);
    if (px < 0 || py < 0 || px >= w || py >= h) return;

    const imgData = layer.ctx.getImageData(0, 0, w, h);
    const data = imgData.data;
    const fillColor = colorToRGBA(fillColorStr);

    const startIdx = (py * w + px) * 4;
    const target = [data[startIdx], data[startIdx + 1], data[startIdx + 2], data[startIdx + 3]];

    // 既に塗りたい色とほぼ同じ場所ならなにもしない
    if (Math.abs(target[0] - fillColor[0]) <= 4 &&
        Math.abs(target[1] - fillColor[1]) <= 4 &&
        Math.abs(target[2] - fillColor[2]) <= 4 &&
        Math.abs(target[3] - fillColor[3]) <= 4) {
      return;
    }

    const tolerance = 32;
    const tol2 = tolerance * tolerance;
    function matches(idx) {
      const dr = data[idx] - target[0];
      const dg = data[idx + 1] - target[1];
      const db = data[idx + 2] - target[2];
      const da = data[idx + 3] - target[3];
      return dr * dr + dg * dg + db * db + da * da <= tol2;
    }
    function setPixel(idx) {
      data[idx] = fillColor[0];
      data[idx + 1] = fillColor[1];
      data[idx + 2] = fillColor[2];
      data[idx + 3] = fillColor[3];
    }

    // スキャンライン方式のフラッドフィル(素朴な1px単位より高速)
    const stack = [[px, py]];
    while (stack.length) {
      const [cx, cy] = stack.pop();
      const rowIdx = cy * w;
      if (!matches((rowIdx + cx) * 4)) continue;

      let xl = cx;
      while (xl > 0 && matches((rowIdx + xl - 1) * 4)) xl--;
      let xr = cx;
      while (xr < w - 1 && matches((rowIdx + xr + 1) * 4)) xr++;

      for (let i = xl; i <= xr; i++) setPixel((rowIdx + i) * 4);

      [cy - 1, cy + 1].forEach(ny => {
        if (ny < 0 || ny >= h) return;
        const nRowIdx = ny * w;
        let i = xl;
        while (i <= xr) {
          if (matches((nRowIdx + i) * 4)) {
            stack.push([i, ny]);
            while (i <= xr && matches((nRowIdx + i) * 4)) i++;
          } else {
            i++;
          }
        }
      });
    }

    layer.ctx.putImageData(imgData, 0, 0);
  }

  function restoreFromDataURL(layer, dataUrl) {
    const img = new Image();
    img.onload = () => {
      const rect = wrap.getBoundingClientRect();
      layer.ctx.save();
      layer.ctx.setTransform(1, 0, 0, 1, 0, 0);
      layer.ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
      layer.ctx.restore();
      layer.ctx.drawImage(img, 0, 0, rect.width, rect.height);
    };
    img.src = dataUrl;
  }

  function start(e) {
    e.preventDefault();
    const layer = activeLayer();
    const p = getPos(e);

    if (currentTool === 'bucket') {
      pushHistory(layer);
      floodFillAt(layer, p.x, p.y, currentColor);
      drawing = false;
      return;
    }

    drawing = true;
    pushHistory(layer);
    rawPoint = { x: p.x, y: p.y };
    smoothPoint = { x: p.x, y: p.y };
    lastTime = p.t;

    if (currentTool === 'eraser') {
      layer.ctx.save();
      layer.ctx.globalCompositeOperation = 'destination-out';
      layer.ctx.lineWidth = Number(sizeSlider.value) * 1.4;
      layer.ctx.beginPath();
      layer.ctx.moveTo(p.x, p.y);
      layer.ctx.lineTo(p.x + 0.01, p.y + 0.01);
      layer.ctx.stroke();
      layer.ctx.restore();
    } else {
      layer.ctx.save();
      if (currentTool === 'pencil') {
        layer.ctx.globalAlpha = 0.82 + Math.random() * 0.18;
      }
      layer.ctx.beginPath();
      layer.ctx.arc(p.x, p.y, strokeWidthFor() / 2, 0, Math.PI * 2);
      layer.ctx.fillStyle = currentColor;
      layer.ctx.fill();
      layer.ctx.restore();
    }
  }

  function move(e) {
    if (currentTool === 'bucket') return; // バケツはタップのみ、ドラッグでは何もしない
    if (!drawing) return;
    e.preventDefault();
    const p = getPos(e);
    const dt = Math.max(1, p.t - lastTime);
    lastTime = p.t;

    // 指数移動平均(EMA)で補正: factorが大きいほど生の位置に近く遅延が少ない
    const factor = SMOOTHING_LEVELS[smoothingIndex].factor;
    const prevSmooth = { x: smoothPoint.x, y: smoothPoint.y };
    smoothPoint.x += (p.x - smoothPoint.x) * factor;
    smoothPoint.y += (p.y - smoothPoint.y) * factor;

    let toX = smoothPoint.x;
    let toY = smoothPoint.y;
    if (currentTool === 'pencil') {
      // ほんの少し位置も揺らして手描きのザラつきを足す(次のセグメントにも引き継ぐ)
      smoothPoint.x += (Math.random() - 0.5) * 1.2;
      smoothPoint.y += (Math.random() - 0.5) * 1.2;
      toX = smoothPoint.x;
      toY = smoothPoint.y;
    }

    const layer = activeLayer();

    if (currentTool === 'eraser') {
      layer.ctx.save();
      layer.ctx.globalCompositeOperation = 'destination-out';
      layer.ctx.lineWidth = Number(sizeSlider.value) * 1.4;
      layer.ctx.beginPath();
      layer.ctx.moveTo(prevSmooth.x, prevSmooth.y);
      layer.ctx.lineTo(smoothPoint.x, smoothPoint.y);
      layer.ctx.stroke();
      layer.ctx.restore();
    } else {
      layer.ctx.save();
      if (currentTool === 'pencil') {
        layer.ctx.globalAlpha = 0.82 + Math.random() * 0.18;
      }
      layer.ctx.strokeStyle = currentColor;
      layer.ctx.lineWidth = strokeWidthFor();
      layer.ctx.beginPath();
      layer.ctx.moveTo(prevSmooth.x, prevSmooth.y);
      layer.ctx.lineTo(toX, toY);
      layer.ctx.stroke();
      layer.ctx.restore();
    }
  }

  function end() {
    drawing = false;
  }

  wrap.addEventListener('mousedown', start);
  wrap.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  wrap.addEventListener('touchstart', start, { passive: false });
  wrap.addEventListener('touchmove', move, { passive: false });
  wrap.addEventListener('touchend', end);
  wrap.addEventListener('touchcancel', end);

  // ---------- Undo / Redo / Clear ----------
  undoBtn.addEventListener('click', () => {
    const layer = activeLayer();
    if (!layer.undoStack.length) return;
    layer.redoStack.push(layer.canvas.toDataURL());
    const prev = layer.undoStack.pop();
    restoreFromDataURL(layer, prev);
  });
  redoBtn.addEventListener('click', () => {
    const layer = activeLayer();
    if (!layer.redoStack.length) return;
    layer.undoStack.push(layer.canvas.toDataURL());
    const next = layer.redoStack.pop();
    restoreFromDataURL(layer, next);
  });
  clearLayerBtn.addEventListener('click', () => {
    const layer = activeLayer();
    pushHistory(layer);
    layer.ctx.save();
    layer.ctx.setTransform(1, 0, 0, 1, 0, 0);
    layer.ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
    layer.ctx.restore();
  });

  // ---------- 保存 ----------
  // iOS Safari は <a download> を無視するため、
  // 1) Web Share API (ファイル共有) → 「画像を保存」で写真アプリに保存できる
  // 2) だめな場合は新しいタブで画像を開き、長押しで保存してもらう
  // という順でフォールバックする
  function mergeCanvas() {
    const rect = wrap.getBoundingClientRect();
    const out = document.createElement('canvas');
    out.width = rect.width * dpr;
    out.height = rect.height * dpr;
    const octx = out.getContext('2d');
    octx.fillStyle = '#ffffff';
    octx.fillRect(0, 0, out.width, out.height);
    layers.forEach(layer => {
      if (layer.visible) octx.drawImage(layer.canvas, 0, 0);
    });
    return out;
  }

  const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  saveBtn.addEventListener('click', () => {
    const out = mergeCanvas();
    const filename = `oekaki-${Date.now()}.png`;

    out.toBlob(async (blob) => {
      if (!blob) return fallbackOpenTab(out);

      const file = new File([blob], filename, { type: 'image/png' });
      const canUseShare = navigator.canShare && navigator.canShare({ files: [file] });

      if (canUseShare) {
        try {
          await navigator.share({ files: [file], title: 'おえかき' });
          return; // 共有シートから「画像を保存」で写真アプリへ
        } catch (err) {
          if (err && err.name === 'AbortError') return; // ユーザーがキャンセルしただけ
          // それ以外のエラーは下のフォールバックへ進む
        }
      }

      if (isIOS) {
        // iOS Safariは <a download> を無視するため、新しいタブで開いて長押し保存してもらう
        fallbackOpenTab(out);
      } else {
        // デスクトップ/Androidは通常のダウンロードで問題なし
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      }
    }, 'image/png');
  });

  function fallbackOpenTab(canvasEl) {
    const w = window.open('', '_blank');
    if (!w) return; // ポップアップブロック時は何もできない
    const dataUrl = canvasEl.toDataURL('image/png');
    w.document.write(
      `<title>おえかき保存</title>
       <body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;">
       <p style="position:fixed;top:12px;left:0;right:0;text-align:center;color:#fff;font-family:sans-serif;font-size:14px;">画像を長押しして「写真に保存」を選んでください</p>
       <img src="${dataUrl}" style="max-width:100%;height:auto;">
       </body>`
    );
  }

  window.addEventListener('resize', resizeAllCanvases);

  // ---------- 初期化 ----------
  buildLayerTabs();
  resizeAllCanvases();
  applyMode();
  applySmoothingLabel();
  setTool('pencil');
})();
</script>

</body>
</html>
