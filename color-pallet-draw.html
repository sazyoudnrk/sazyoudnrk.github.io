<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おえかき</title>
<style>
  :root{
    --bg: #1b1b1f;
    --panel: #232329;
    --panel-2: #2c2c33;
    --ink: #f2f0ea;
    --muted: #8b8a94;
    --accent: #f2f0ea;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  header {
    padding: 12px 14px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 0;
  }
  h1 span { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: 6px; }
  #save {
    background: var(--panel);
    border: none;
    color: var(--ink);
    width: 38px;
    height: 38px;
    border-radius: 12px;
    font-size: 17px;
    cursor: pointer;
  }
  #save:active { background: var(--panel-2); }

  #canvas-wrap {
    flex: 1;
    margin: 4px 12px;
    border-radius: 18px;
    overflow: hidden;
    background: #ffffff;
    box-shadow: 0 0 0 1px #33333a;
    position: relative;
    touch-action: none;
  }
  #stage {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    transform-origin: 0 0;
  }
  #stage canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    image-rendering: pixelated;
  }

  #dock {
    padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .row::-webkit-scrollbar { display: none; }

  .group {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--panel);
    padding: 5px;
    border-radius: 14px;
    flex-shrink: 0;
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--ink);
    font-size: 15px;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:active { background: var(--panel-2); }
  .icon-btn.active {
    background: var(--ink);
    color: #16161a;
  }

  .layer-tab {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    width: 30px;
    height: 34px;
    border-radius: 10px;
    cursor: pointer;
  }
  .layer-tab.active { background: var(--ink); color: #16161a; }
  .eye-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 13px;
    width: 26px;
    height: 34px;
    cursor: pointer;
    padding: 0;
  }
  .eye-btn.off { opacity: 0.35; }

  .pen-btn {
    font-size: 12px;
    font-weight: 600;
    padding: 0 10px;
    width: auto;
  }

  .swatches {
    display: flex;
    gap: 6px;
    background: var(--panel);
    padding: 5px;
    border-radius: 14px;
    flex: 1;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .swatches::-webkit-scrollbar { display: none; }
  .swatch {
    width: 32px;
    height: 32px;
    min-width: 32px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    position: relative;
  }
  .swatch.active {
    box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px currentColor;
  }

  .dropdown {
    background: var(--panel);
    color: var(--ink);
    border: none;
    border-radius: 14px;
    padding: 8px 8px;
    font-size: 12px;
    font-weight: 600;
    -webkit-appearance: none;
    appearance: none;
    flex-shrink: 0;
  }
  .dropdown:disabled { opacity: 0.4; }

  .zoom-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--ink);
    min-width: 40px;
    text-align: center;
    flex-shrink: 0;
  }

  .size-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    padding: 5px 10px;
    border-radius: 14px;
    flex: 1;
    min-width: 90px;
  }
  .size-wrap span { font-size: 11px; color: var(--muted); flex-shrink: 0; }
  input[type="range"] {
    flex: 1;
    accent-color: var(--ink);
    min-width: 40px;
  }
</style>
</head>
<body>

<header>
  <h1>おえかき <span id="mode-label"></span></h1>
  <button id="save" title="保存">💾</button>
</header>

<div id="canvas-wrap"><div id="stage"></div></div>

<div id="dock">

  <div class="row">
    <div class="group" id="layers"></div>
    <div class="group">
      <button class="icon-btn" id="undo" title="戻す">↺</button>
      <button class="icon-btn" id="redo" title="進む">↻</button>
      <button class="icon-btn" id="clear-layer" title="このレイヤーを消す">🗑</button>
    </div>
    <div class="group">
      <button class="icon-btn" id="zoom-out" title="縮小">−</button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button class="icon-btn" id="zoom-in" title="拡大">＋</button>
      <button class="icon-btn" id="zoom-reset" title="表示をリセット">⟲</button>
    </div>
  </div>

  <div class="row">
    <select class="dropdown" id="color-type-select">
      <option value="full">全色</option>
      <option value="vivid">ビビット</option>
      <option value="muted">くすみ</option>
      <option value="pastel">パステル</option>
    </select>
    <select class="dropdown" id="hue-type-select">
      <option value="square">四角(4色)</option>
      <option value="triangle">三角(3色)</option>
      <option value="complement">補色(2色)</option>
      <option value="broom">ほうき(4色)</option>
      <option value="random">ランダム(4色)</option>
    </select>
    <button class="icon-btn" id="shuffle" title="パレットを生成">🎲</button>
    <button class="icon-btn pen-btn" id="default-toggle" title="定番パレット">定番</button>
  </div>
  <div class="row">
    <div class="swatches" id="swatches"></div>
  </div>

  <div class="row">
    <div class="group">
      <button class="icon-btn pen-btn" data-pen="pencil">鉛筆</button>
      <button class="icon-btn pen-btn" data-pen="marker">マーカー</button>
      <button class="icon-btn" id="eraser" title="消しゴム">🧽</button>
      <button class="icon-btn" id="bucket" title="バケツ塗り">🪣</button>
      <button class="icon-btn" id="pan-tool" title="移動(パン)">✋</button>
    </div>
    <div class="size-wrap">
      <span>太さ</span>
      <input type="range" id="size" min="1" max="50" value="10">
    </div>
    <button class="icon-btn pen-btn" id="smoothing-btn"></button>
  </div>

</div>

<script>
(function(){
  const wrap = document.getElementById('canvas-wrap');
  const stage = document.getElementById('stage');
  const layersDock = document.getElementById('layers');
  const swatchWrap = document.getElementById('swatches');
  const sizeSlider = document.getElementById('size');
  const shuffleBtn = document.getElementById('shuffle');
  const colorTypeSelect = document.getElementById('color-type-select');
  const hueTypeSelect = document.getElementById('hue-type-select');
  const defaultToggleBtn = document.getElementById('default-toggle');
  const modeLabel = document.getElementById('mode-label');
  const saveBtn = document.getElementById('save');
  const undoBtn = document.getElementById('undo');
  const redoBtn = document.getElementById('redo');
  const clearLayerBtn = document.getElementById('clear-layer');
  const eraserBtn = document.getElementById('eraser');
  const bucketBtn = document.getElementById('bucket');
  const panToolBtn = document.getElementById('pan-tool');
  const penBtns = [...document.querySelectorAll('[data-pen]')];
  const smoothingBtn = document.getElementById('smoothing-btn');
  const zoomInBtn = document.getElementById('zoom-in');
  const zoomOutBtn = document.getElementById('zoom-out');
  const zoomResetBtn = document.getElementById('zoom-reset');
  const zoomLabel = document.getElementById('zoom-label');

  let dpr = Math.max(1, window.devicePixelRatio || 1);
  let currentColor = null;
  let currentTool = 'pencil'; // 'pencil' | 'marker' | 'eraser' | 'bucket' | 'pan'
  let drawing = false;
  let lastTime = 0;
  let rawPoint = null;    // 生の指の位置(キャンバス座標系)
  let smoothPoint = null; // 補正後の描画位置(キャンバス座標系)
  let panStart = null;    // パン開始時の情報

  // 手ぶれ補正: 大きいほど生の位置に近い(遅延が少ない) = 補正弱い
  const SMOOTHING_LEVELS = [
    { key: 'off',   label: '補正:なし', factor: 1 },
    { key: 'light', label: '補正:弱',   factor: 0.6 },
    { key: 'heavy', label: '補正:強',   factor: 0.28 },
  ];
  let smoothingIndex = 1; // デフォルトは「弱」

  const PEN_STYLES = {
    marker: { widthMul: 1.0 }, // くっきり一定の太さの線(不透明度は常に100%)
  };

  function clampNum(v, min, max) { return Math.min(max, Math.max(min, v)); }
  function snap(v) { return Math.round(v); } // アンチエイリアス低減のため整数pxへスナップ

  // ---------- ズーム / パン(表示倍率のみを変更し、キャンバス解像度は変えない) ----------
  const ZOOM_LEVELS = [1, 2, 4, 8];
  let zoomIndex = 0;
  let panX = 0, panY = 0;

  function zoomLevel() { return ZOOM_LEVELS[zoomIndex]; }

  function applyZoom() {
    const z = zoomLevel();
    stage.style.transform = `translate(${panX}px, ${panY}px) scale(${z})`;
    zoomLabel.textContent = `${z * 100}%`;
  }
  zoomInBtn.addEventListener('click', () => {
    zoomIndex = Math.min(ZOOM_LEVELS.length - 1, zoomIndex + 1);
    applyZoom();
  });
  zoomOutBtn.addEventListener('click', () => {
    zoomIndex = Math.max(0, zoomIndex - 1);
    if (zoomIndex === 0) { panX = 0; panY = 0; }
    applyZoom();
  });
  zoomResetBtn.addEventListener('click', () => {
    zoomIndex = 0; panX = 0; panY = 0;
    applyZoom();
  });

  // ---------- レイヤー管理 ----------
  const LAYER_COUNT = 3;
  const layers = []; // {canvas, ctx, visible, undoStack, redoStack}
  let activeLayerIndex = LAYER_COUNT - 1;

  function makeCanvas(z) {
    const c = document.createElement('canvas');
    c.style.zIndex = z;
    stage.appendChild(c);
    return c;
  }

  for (let i = 0; i < LAYER_COUNT; i++) {
    const canvas = makeCanvas(i);
    layers.push({
      canvas,
      ctx: canvas.getContext('2d'),
      visible: true,
      undoStack: [],
      redoStack: [],
    });
  }

  function activeLayer() { return layers[activeLayerIndex]; }

  function buildLayerTabs() {
    layersDock.innerHTML = '';
    layers.forEach((layer, i) => {
      const tab = document.createElement('button');
      tab.className = 'layer-tab' + (i === activeLayerIndex ? ' active' : '');
      tab.textContent = (i + 1);
      tab.addEventListener('click', () => {
        activeLayerIndex = i;
        buildLayerTabs();
      });
      const eye = document.createElement('button');
      eye.className = 'eye-btn' + (layer.visible ? '' : ' off');
      eye.textContent = layer.visible ? '👁' : '🚫';
      eye.addEventListener('click', (e) => {
        e.stopPropagation();
        layer.visible = !layer.visible;
        layer.canvas.style.opacity = layer.visible ? '1' : '0';
        buildLayerTabs();
      });
      layersDock.appendChild(tab);
      layersDock.appendChild(eye);
    });
  }

  // ========================================================================
  // カラーパレット生成
  // 内部表現: 既存実装(HSL文字列)を踏襲。色相は必ず0〜360°へ正規化する。
  // 不透明度(Alpha)はここでは一切ランダム化しない(常に不透明な色を生成)。
  // ========================================================================

  function normHue(h) { return ((h % 360) + 360) % 360; }
  function rnd(min, max) { return min + Math.random() * (max - min); }
  function pm(delta) { return delta * (Math.random() < 0.5 ? -1 : 1); } // ±delta

  function hslColor(h, s, l) {
    return `hsl(${normHue(h).toFixed(1)}, ${clampNum(s, 0, 100).toFixed(0)}%, ${clampNum(l, 0, 100).toFixed(0)}%)`;
  }

  function randomCount() { return 2 + Math.floor(Math.random() * 7); } // 2〜8色 (「全色」等の可変色数モードで使用)

  // ---- 「色の種類」: 彩度・明度の範囲を決定 ----
  const COLOR_TYPES = {
    full:   { label: '全色',       s: [20, 100], l: [15, 85] },
    vivid:  { label: 'ビビット',   s: [70, 100], l: [40, 70] },
    muted:  { label: 'くすみ',     s: [20, 60],  l: [40, 75] },
    pastel: { label: 'パステル',   s: [45, 80],  l: [65, 85] },
  };

  // ---- 「色相の選択」: 色相環上の関係と色数を決定 ----
  const HUE_TYPES = {
    square: {
      label: '四角(4色)', count: 4,
      gen: () => { const H1 = rnd(0, 360); return [H1, H1 + 90 + pm(rnd(5, 20)), H1 + 180 + pm(rnd(5, 20)), H1 + 270 + pm(rnd(5, 20))]; },
    },
    triangle: {
      label: '三角(3色)', count: 3,
      gen: () => { const H1 = rnd(0, 360); return [H1, H1 + 120 + pm(rnd(5, 20)), H1 + 240 + pm(rnd(5, 20))]; },
    },
    complement: {
      label: '補色(2色)', count: 2,
      gen: () => { const H1 = rnd(0, 360); return [H1, H1 + 180 + pm(rnd(5, 15))]; },
    },
    broom: {
      label: 'ほうき(4色)', count: 4,
      gen: () => {
        const H1 = rnd(0, 360), A = rnd(20, 60);
        return [H1, H1 + 180, H1 + A + pm(rnd(5, 10)), H1 - A + pm(rnd(5, 10))];
      },
    },
    random: {
      label: 'ランダム(4色)', count: 4,
      gen: () => [rnd(0, 360), rnd(0, 360), rnd(0, 360), rnd(0, 360)],
    },
  };

  // ---- 2軸を組み合わせて最終パレットを生成 ----
  // 色の種類 → 彩度・明度の範囲 / 色相の選択 → 色相環上の関係、を独立に決定する
  function generatePalette(colorTypeKey, hueTypeKey) {
    const ct = COLOR_TYPES[colorTypeKey];
    const ht = HUE_TYPES[hueTypeKey];
    const hues = ht.gen();
    const baseS = rnd(ct.s[0], ct.s[1]);
    const baseL = rnd(ct.l[0], ct.l[1]);
    return hues.map(H => hslColor(
      H,
      clampNum(baseS + pm(rnd(0, 10)), ct.s[0], ct.s[1]),
      clampNum(baseL + pm(rnd(0, 10)), ct.l[0], ct.l[1])
    ));
  }

  // 定番パレット(固定色。既存機能をそのまま維持)
  const DEFAULT_PALETTE = [
    '#111111', '#f2f0ea', '#e63946', '#f4a261',
    '#ffd166', '#2a9d8f', '#264653', '#4361ee',
    '#7b2cbf', '#ff70a6', '#8d6a4f', '#adb5bd'
  ];

  function buildSwatches(colors) {
    swatchWrap.innerHTML = '';
    colors.forEach((c) => {
      const b = document.createElement('button');
      b.className = 'swatch';
      b.style.background = c;
      b.style.color = c;
      b.addEventListener('click', () => selectColor(c, b));
      swatchWrap.appendChild(b);
    });
    selectColor(colors[0], swatchWrap.children[0]);
  }

  function selectColor(c, btn) {
    currentColor = c;
    [...swatchWrap.children].forEach(el => el.classList.remove('active'));
    if (btn) btn.classList.add('active');
    // 色を選んだら自動的にペンツールに戻す(消しゴムのままだと分かりにくいので)
    if (currentTool === 'eraser') setTool('pencil');
  }

  let useDefaultPalette = false;

  function applyPalette() {
    if (useDefaultPalette) {
      modeLabel.textContent = '定番パレット';
      shuffleBtn.style.display = 'none';
      colorTypeSelect.disabled = true;
      hueTypeSelect.disabled = true;
      buildSwatches(DEFAULT_PALETTE);
    } else {
      const colorTypeKey = colorTypeSelect.value;
      const hueTypeKey = hueTypeSelect.value;
      modeLabel.textContent = `${COLOR_TYPES[colorTypeKey].label}・${HUE_TYPES[hueTypeKey].label}`;
      shuffleBtn.style.display = 'flex';
      colorTypeSelect.disabled = false;
      hueTypeSelect.disabled = false;
      buildSwatches(generatePalette(colorTypeKey, hueTypeKey));
    }
  }

  colorTypeSelect.addEventListener('change', applyPalette);
  hueTypeSelect.addEventListener('change', applyPalette);
  shuffleBtn.addEventListener('click', applyPalette);
  defaultToggleBtn.addEventListener('click', () => {
    useDefaultPalette = !useDefaultPalette;
    defaultToggleBtn.classList.toggle('active', useDefaultPalette);
    applyPalette();
  });

  // ---------- ツール切り替え ----------
  function setTool(tool) {
    currentTool = tool;
    penBtns.forEach(b => b.classList.toggle('active', b.dataset.pen === tool));
    eraserBtn.classList.toggle('active', tool === 'eraser');
    bucketBtn.classList.toggle('active', tool === 'bucket');
    panToolBtn.classList.toggle('active', tool === 'pan');
  }
  penBtns.forEach(b => b.addEventListener('click', () => setTool(b.dataset.pen)));
  eraserBtn.addEventListener('click', () => setTool('eraser'));
  bucketBtn.addEventListener('click', () => setTool('bucket'));
  panToolBtn.addEventListener('click', () => setTool('pan'));

  function applySmoothingLabel() {
    smoothingBtn.textContent = SMOOTHING_LEVELS[smoothingIndex].label;
  }
  smoothingBtn.addEventListener('click', () => {
    smoothingIndex = (smoothingIndex + 1) % SMOOTHING_LEVELS.length;
    applySmoothingLabel();
  });

  // ---------- キャンバスサイズ(解像度はズームに関係なくwrapの実サイズに固定) ----------
  function resizeAllCanvases() {
    const rect = wrap.getBoundingClientRect();
    dpr = Math.max(1, window.devicePixelRatio || 1);

    layers.forEach(layer => {
      const prev = document.createElement('canvas');
      prev.width = layer.canvas.width;
      prev.height = layer.canvas.height;
      if (prev.width > 0) prev.getContext('2d').drawImage(layer.canvas, 0, 0);

      layer.canvas.width = rect.width * dpr;
      layer.canvas.height = rect.height * dpr;
      layer.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      layer.ctx.lineCap = 'round';
      layer.ctx.lineJoin = 'round';
      layer.ctx.imageSmoothingEnabled = false; // アンチエイリアスの影響を可能な範囲で抑える

      if (prev.width > 0) {
        layer.ctx.drawImage(prev, 0, 0, prev.width, prev.height, 0, 0, rect.width, rect.height);
      }
    });
  }

  // ---------- 座標変換: 画面座標 → ズーム/パンを考慮したキャンバス座標 ----------
  function getPos(e) {
    const rect = wrap.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    const screenX = t.clientX - rect.left;
    const screenY = t.clientY - rect.top;
    const z = zoomLevel();
    // stageには transform: translate(panX,panY) scale(z) がかかっているので、
    // 逆変換でキャンバス座標(ズーム前と同じ座標系)に戻す
    return { x: (screenX - panX) / z, y: (screenY - panY) / z, t: Date.now() };
  }

  function strokeWidthFor() {
    const base = Number(sizeSlider.value);
    if (currentTool === 'marker') return Math.max(1, base * PEN_STYLES.marker.widthMul);
    if (currentTool === 'pencil') {
      // ストローク内でごくわずかに太さを揺らす(数px以内、ほぼ一定)
      const jitter = clampNum(base * 0.08, 0.15, 0.8);
      const w = base + (Math.random() - 0.5) * 2 * jitter;
      return Math.max(1, Math.round(w)); // 最小1px
    }
    return base;
  }

  function pushHistory(layer) {
    layer.undoStack.push(layer.canvas.toDataURL());
    if (layer.undoStack.length > 20) layer.undoStack.shift();
    layer.redoStack = [];
  }

  // ---------- バケツ塗り ----------
  const colorProbe = document.createElement('canvas');
  colorProbe.width = 1; colorProbe.height = 1;
  const colorProbeCtx = colorProbe.getContext('2d');
  function colorToRGBA(str) {
    colorProbeCtx.clearRect(0, 0, 1, 1);
    colorProbeCtx.fillStyle = str;
    colorProbeCtx.fillRect(0, 0, 1, 1);
    return colorProbeCtx.getImageData(0, 0, 1, 1).data;
  }

  function floodFillAt(layer, cssX, cssY, fillColorStr) {
    const canvas = layer.canvas;
    const w = canvas.width, h = canvas.height;
    const px = Math.floor(cssX * dpr);
    const py = Math.floor(cssY * dpr);
    if (px < 0 || py < 0 || px >= w || py >= h) return;

    const imgData = layer.ctx.getImageData(0, 0, w, h);
    const data = imgData.data;
    const fillColor = colorToRGBA(fillColorStr);

    const startIdx = (py * w + px) * 4;
    const target = [data[startIdx], data[startIdx + 1], data[startIdx + 2], data[startIdx + 3]];

    // 既に塗りたい色とほぼ同じ場所ならなにもしない
    if (Math.abs(target[0] - fillColor[0]) <= 4 &&
        Math.abs(target[1] - fillColor[1]) <= 4 &&
        Math.abs(target[2] - fillColor[2]) <= 4 &&
        Math.abs(target[3] - fillColor[3]) <= 4) {
      return;
    }

    const tolerance = 32;
    const tol2 = tolerance * tolerance;
    function matches(idx) {
      const dr = data[idx] - target[0];
      const dg = data[idx + 1] - target[1];
      const db = data[idx + 2] - target[2];
      const da = data[idx + 3] - target[3];
      return dr * dr + dg * dg + db * db + da * da <= tol2;
    }
    function setPixel(idx) {
      data[idx] = fillColor[0];
      data[idx + 1] = fillColor[1];
      data[idx + 2] = fillColor[2];
      data[idx + 3] = fillColor[3];
    }

    // スキャンライン方式のフラッドフィル(素朴な1px単位より高速)
    const stack = [[px, py]];
    while (stack.length) {
      const [cx, cy] = stack.pop();
      const rowIdx = cy * w;
      if (!matches((rowIdx + cx) * 4)) continue;

      let xl = cx;
      while (xl > 0 && matches((rowIdx + xl - 1) * 4)) xl--;
      let xr = cx;
      while (xr < w - 1 && matches((rowIdx + xr + 1) * 4)) xr++;

      for (let i = xl; i <= xr; i++) setPixel((rowIdx + i) * 4);

      [cy - 1, cy + 1].forEach(ny => {
        if (ny < 0 || ny >= h) return;
        const nRowIdx = ny * w;
        let i = xl;
        while (i <= xr) {
          if (matches((nRowIdx + i) * 4)) {
            stack.push([i, ny]);
            while (i <= xr && matches((nRowIdx + i) * 4)) i++;
          } else {
            i++;
          }
        }
      });
    }

    layer.ctx.putImageData(imgData, 0, 0);
  }

  function restoreFromDataURL(layer, dataUrl) {
    const img = new Image();
    img.onload = () => {
      const rect = wrap.getBoundingClientRect();
      layer.ctx.save();
      layer.ctx.setTransform(1, 0, 0, 1, 0, 0);
      layer.ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
      layer.ctx.restore();
      layer.ctx.drawImage(img, 0, 0, rect.width, rect.height);
    };
    img.src = dataUrl;
  }

  // ---------- 描画 / パン ----------
  function start(e) {
    e.preventDefault();
    const t = e.touches ? e.touches[0] : e;

    if (currentTool === 'pan') {
      panStart = { x: t.clientX, y: t.clientY, panX, panY };
      drawing = true;
      return;
    }

    const layer = activeLayer();
    const p = getPos(e);

    if (currentTool === 'bucket') {
      pushHistory(layer);
      floodFillAt(layer, p.x, p.y, currentColor);
      drawing = false;
      return;
    }

    drawing = true;
    pushHistory(layer);
    rawPoint = { x: p.x, y: p.y };
    smoothPoint = { x: p.x, y: p.y };
    lastTime = p.t;

    if (currentTool === 'eraser') {
      layer.ctx.save();
      layer.ctx.globalCompositeOperation = 'destination-out';
      layer.ctx.beginPath();
      layer.ctx.arc(snap(p.x), snap(p.y), (Number(sizeSlider.value) * 1.4) / 2, 0, Math.PI * 2);
      layer.ctx.fill();
      layer.ctx.restore();
    } else {
      layer.ctx.save();
      layer.ctx.beginPath();
      layer.ctx.arc(snap(p.x), snap(p.y), strokeWidthFor() / 2, 0, Math.PI * 2);
      layer.ctx.fillStyle = currentColor;
      layer.ctx.fill();
      layer.ctx.restore();
    }
  }

  function move(e) {
    if (currentTool === 'pan') {
      if (!drawing || !panStart) return;
      e.preventDefault();
      const t = e.touches ? e.touches[0] : e;
      panX = panStart.panX + (t.clientX - panStart.x);
      panY = panStart.panY + (t.clientY - panStart.y);
      applyZoom();
      return;
    }
    if (currentTool === 'bucket') return; // バケツはタップのみ、ドラッグでは何もしない
    if (!drawing) return;
    e.preventDefault();
    const p = getPos(e);
    const dt = Math.max(1, p.t - lastTime);
    lastTime = p.t;

    // 指数移動平均(EMA)で補正: factorが大きいほど生の位置に近く遅延が少ない
    const factor = SMOOTHING_LEVELS[smoothingIndex].factor;
    const prevSmooth = { x: smoothPoint.x, y: smoothPoint.y };
    smoothPoint.x += (p.x - smoothPoint.x) * factor;
    smoothPoint.y += (p.y - smoothPoint.y) * factor;

    if (currentTool === 'pencil') {
      // ほんの少し位置も揺らして手描きのザラつきを足す(次のセグメントにも引き継ぐ)
      smoothPoint.x += (Math.random() - 0.5) * 1.2;
      smoothPoint.y += (Math.random() - 0.5) * 1.2;
    }

    const layer = activeLayer();
    const fromX = snap(prevSmooth.x), fromY = snap(prevSmooth.y);
    const toX = snap(smoothPoint.x), toY = snap(smoothPoint.y);

    if (currentTool === 'eraser') {
      layer.ctx.save();
      layer.ctx.globalCompositeOperation = 'destination-out';
      layer.ctx.lineWidth = Number(sizeSlider.value) * 1.4;
      layer.ctx.beginPath();
      layer.ctx.moveTo(fromX, fromY);
      layer.ctx.lineTo(toX, toY);
      layer.ctx.stroke();
      layer.ctx.restore();
    } else {
      layer.ctx.save();
      layer.ctx.strokeStyle = currentColor;
      layer.ctx.lineWidth = strokeWidthFor();
      layer.ctx.beginPath();
      layer.ctx.moveTo(fromX, fromY);
      layer.ctx.lineTo(toX, toY);
      layer.ctx.stroke();
      layer.ctx.restore();
    }
  }

  function end() {
    drawing = false;
    panStart = null;
  }

  wrap.addEventListener('mousedown', start);
  wrap.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  wrap.addEventListener('touchstart', start, { passive: false });
  wrap.addEventListener('touchmove', move, { passive: false });
  wrap.addEventListener('touchend', end);
  wrap.addEventListener('touchcancel', end);

  // ---------- Undo / Redo / Clear ----------
  undoBtn.addEventListener('click', () => {
    const layer = activeLayer();
    if (!layer.undoStack.length) return;
    layer.redoStack.push(layer.canvas.toDataURL());
    const prev = layer.undoStack.pop();
    restoreFromDataURL(layer, prev);
  });
  redoBtn.addEventListener('click', () => {
    const layer = activeLayer();
    if (!layer.redoStack.length) return;
    layer.undoStack.push(layer.canvas.toDataURL());
    const next = layer.redoStack.pop();
    restoreFromDataURL(layer, next);
  });
  clearLayerBtn.addEventListener('click', () => {
    const layer = activeLayer();
    pushHistory(layer);
    layer.ctx.save();
    layer.ctx.setTransform(1, 0, 0, 1, 0, 0);
    layer.ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
    layer.ctx.restore();
  });

  // ---------- 保存 ----------
  // iOS Safari は <a download> を無視するため、
  // 1) Web Share API (ファイル共有) → 「画像を保存」で写真アプリに保存できる
  // 2) だめな場合は新しいタブで画像を開き、長押しで保存してもらう
  // という順でフォールバックする
  function mergeCanvas() {
    const rect = wrap.getBoundingClientRect();
    const out = document.createElement('canvas');
    out.width = rect.width * dpr;
    out.height = rect.height * dpr;
    const octx = out.getContext('2d');
    octx.imageSmoothingEnabled = false;
    octx.fillStyle = '#ffffff';
    octx.fillRect(0, 0, out.width, out.height);
    layers.forEach(layer => {
      if (layer.visible) octx.drawImage(layer.canvas, 0, 0);
    });
    return out;
  }

  const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  saveBtn.addEventListener('click', () => {
    const out = mergeCanvas();
    const filename = `oekaki-${Date.now()}.png`;

    out.toBlob(async (blob) => {
      if (!blob) return fallbackOpenTab(out);

      const file = new File([blob], filename, { type: 'image/png' });
      const canUseShare = navigator.canShare && navigator.canShare({ files: [file] });

      if (canUseShare) {
        try {
          await navigator.share({ files: [file], title: 'おえかき' });
          return; // 共有シートから「画像を保存」で写真アプリへ
        } catch (err) {
          if (err && err.name === 'AbortError') return; // ユーザーがキャンセルしただけ
          // それ以外のエラーは下のフォールバックへ進む
        }
      }

      if (isIOS) {
        // iOS Safariは <a download> を無視するため、新しいタブで開いて長押し保存してもらう
        fallbackOpenTab(out);
      } else {
        // デスクトップ/Androidは通常のダウンロードで問題なし
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      }
    }, 'image/png');
  });

  function fallbackOpenTab(canvasEl) {
    const w = window.open('', '_blank');
    if (!w) return; // ポップアップブロック時は何もできない
    const dataUrl = canvasEl.toDataURL('image/png');
    w.document.write(
      `<title>おえかき保存</title>
       <body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;">
       <p style="position:fixed;top:12px;left:0;right:0;text-align:center;color:#fff;font-family:sans-serif;font-size:14px;">画像を長押しして「写真に保存」を選んでください</p>
       <img src="${dataUrl}" style="max-width:100%;height:auto;">
       </body>`
    );
  }

  window.addEventListener('resize', resizeAllCanvases);

  // ---------- 初期化 ----------
  buildLayerTabs();
  resizeAllCanvases();
  applyPalette();
  applySmoothingLabel();
  applyZoom();
  setTool('pencil');
})();
</script>

</body>
</html>
